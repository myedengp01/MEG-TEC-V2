name: Fix exact stale TEC-V2 footer
on:
  push:
    paths: ['.github/workflows/fix-exact-old-footer-version.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale footer version and timestamp at source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='v2026.08.10-10:00'; new='v2026.09.20:13:30'
          count=s.count(old)
          s=s.replace(old,new)
          # Old footer version may be constructed from a JavaScript constant or literal.
          s=re.sub(r'(?i)(MEG-TEC-V2\s*)v2026[.\-]08[.\-]10[-:]10:00',lambda m:m.group(1)+new,s)
          # Remove footer-only Timestamp text while preserving claim and audit dates.
          s=re.sub(r'(?i)(<br\s*/?>\s*)?Timestamp:\s*\$\{[^}]+\}','',s)
          s=re.sub(r'(?i)(<br\s*/?>\s*)?Timestamp:\s*20-09-2026-13:\d{2}','',s)
          p.write_text(s,encoding='utf-8')
          print('Exact stale version replacements:',count)
          if old in s: raise SystemExit('Stale version remains')
          PY
      - name: Commit live fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'fix: replace stale TEC-V2 footer version v2026.08.10-10:00' && git push; fi