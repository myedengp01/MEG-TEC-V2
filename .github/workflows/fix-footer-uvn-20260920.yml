name: Fix TEC-V2 footer UVN at source
on:
  push:
    paths: ['.github/workflows/fix-footer-uvn-20260920.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update source footer and visible UVN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          uvn='v2026.09.20:13:30'
          # Replace stale version strings in HTML and JS templates, not just the page title.
          s,n=re.subn(r'(?i)(?<![\w])(?:MEG-TEC-V2\s*)?v2026[.\-]\d{2}[.\-]\d{2}[-:]\d{2}:\d{2}',lambda m: ('MEG-TEC-V2 ' if m.group(0).upper().startswith('MEG-TEC-V2') else '')+uvn,s)
          # Remove the standalone footer timestamp from both literal HTML and JS templates.
          s,k=re.subn(r'(?i)(?:<br\s*/?>\s*)?Timestamp:\s*(?:\$\{[^}]+\}|\d{2}[-/]\d{2}[-/]\d{4}[- :]\d{2}:\d{2}|[^<`\n]{0,80})','',s)
          # Remove any previously inserted cleanup script; fix source instead.
          s=re.sub(r'<script id="meg-clean-footer-timestamps-20260920">.*?</script>','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          print('Version strings updated:',n,'footer timestamp references removed:',k)
          if not n and not k: raise SystemExit('No source matches found; review source before release')
          PY
      - name: Commit and deploy live
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'fix: TEC-V2 footer UVN v2026.09.20:13:30 and remove timestamp' && git push; fi